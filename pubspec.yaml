name: schedule
description: LDCC App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.16.2 <=4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_modular: ^5.0.2
  flutter_animator: ^3.2.1
  http: ^0.13.4
  group_button: ^5.3.4
  html: ^0.15.0
  recase: ^4.0.0
  clipboard: ^0.1.3
  flutter_styled_toast: ^2.0.0
  rive: ^0.9.0
  logger: ^1.1.0
  davi: ^3.4.1
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  skeletonizer: ^2.1.3
  url_launcher: ^6.2.0  # pulls url_launcher_web 2.3.3+

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo_stacked.png
    - assets/images/mark.png
    - assets/rive/dot_wave.riv
    - assets/rive/elastic_circle.riv
    - assets/rive/ldcc_mark.riv
  fonts:
    - family: PTSerif
      fonts:
        - asset: assets/fonts/PTSerif-Regular.ttf
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-VariableFont.ttf
